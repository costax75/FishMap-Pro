<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishMap Pro</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div id="topbar">
        <div class="brand">🎣 FishMap Pro</div>
        <button id="addPoint">＋ Додати промір</button>
        <button id="watersOpen">🗺️ Мої водойми</button>
        <button id="findBest">🎯 Найкраща точка</button>
        <button id="fishPlanOpen">🐟 Підбір насадки</button>
        <button id="weatherOpen">🌦️ Погода</button>
        <button id="journalOpen">📖 Журнал</button>
        <button id="backupOpen">💾 Дані</button>
        <button id="cloudOpen">☁️ Синхронізація</button>
    </div>

    <div id="watersPanel" class="panel hidden">
        <div class="panel-head">
            <b>🏞️ Мої водойми</b>
            <button id="addWater">＋</button>
        </div>
        <div id="watersItems"></div>
    </div>

    <div id="waterCard" class="panel water-card"></div>

    <div id="analysisCard" class="panel analysis-card hidden"></div>
<div id="bestCard" class="panel best-card hidden"></div>
<div id="fishPlan" class="panel fish-plan hidden"></div>
<div id="weatherPanel" class="panel weather-panel hidden"></div>
<div id="journalPanel" class="panel journal-panel hidden"></div>
<div id="backupPanel" class="panel backup-panel hidden"></div>
<div id="cloudPanel" class="panel cloud-panel hidden"></div>

    <div id="reliefControl">
        <button id="toggleRelief">📐 Бровки: ON</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
